<svg width="600" height="160" viewBox="0 0 600 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2136;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1528;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c4963a" />
      <stop offset="50%" style="stop-color:#f7df1e" />
      <stop offset="100%" style="stop-color:#c4963a" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="160" rx="12" fill="url(#parchment)" />
  <rect x="8" y="8" width="584" height="144" rx="8" fill="none" stroke="#9d79d6" stroke-width="1" opacity="0.4" />
  <rect x="14" y="14" width="572" height="132" rx="6" fill="none" stroke="#9d79d6" stroke-width="0.5" opacity="0.2" />
  <text x="20" y="30" font-size="18" fill="#9d79d6" opacity="0.6">&#9830;
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" />
  </text>
  <text x="572" y="30" font-size="18" fill="#9d79d6" opacity="0.6" text-anchor="end">&#9830;
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite" />
  </text>
  <text x="20" y="140" font-size="18" fill="#9d79d6" opacity="0.6">&#9830;
    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="6s" repeatCount="indefinite" />
  </text>
  <text x="572" y="140" font-size="18" fill="#9d79d6" opacity="0.6" text-anchor="end">&#9830;
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite" />
  </text>
  <text x="300" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="url(#goldShine)" filter="url(#glow)" letter-spacing="6">SEND A RAVEN
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite" />
  </text>
  <line x1="100" y1="68" x2="500" y2="68" stroke="#9d79d6" stroke-width="0.5" opacity="0.4" />
  <circle cx="300" cy="68" r="2" fill="#f7df1e" opacity="0.6" />
  <circle cx="200" cy="68" r="1.5" fill="#9d79d6" opacity="0.3" />
  <circle cx="400" cy="68" r="1.5" fill="#9d79d6" opacity="0.3" />
  <text x="300" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c9d1d9">
    <tspan fill="#9d79d6">&#9993;</tspan>
    <tspan fill="#c9d1d9">  LinkedIn</tspan>
    <tspan fill="#555">  &#8226;  </tspan>
    <tspan fill="#9d79d6">&#9881;</tspan>
    <tspan fill="#c9d1d9">  neil-mehta.com</tspan>
  </text>
  <line x1="200" y1="125" x2="400" y2="125" stroke="#9d79d6" stroke-width="0.5" opacity="0.3" />
  <circle cx="300" cy="125" r="2" fill="#9d79d6" opacity="0.3" />
</svg>
